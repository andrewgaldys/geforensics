<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Guardian Edge Forensics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
  <!-- Styles are inline because this page can be served from any URL depth. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #0a192f;
      color: #ffffff;
      font-family: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 480px; }
    img { width: 96px; height: 96px; margin: 0 auto 32px; display: block; }
    p.code { margin: 0 0 8px; color: #a3b4cc; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: 2.2rem; font-weight: 500; line-height: 1.15; }
    p { margin: 0 0 32px; color: #d3dceb; font-size: 1.1rem; line-height: 1.6; }
    a.btn {
      display: inline-block;
      padding: 13px 26px;
      background: #ffffff;
      color: #0a192f;
      border-radius: 6px;
      font-weight: 500;
      text-decoration: none;
    }
    a.btn:hover { background: #d3dceb; }
    a:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img id="logo" src="" alt="Guardian Edge Forensics" hidden>
    <p class="code">Error 404</p>
    <h1>We couldn't find that page</h1>
    <p>The page may have moved. Head back to the homepage or call (772) 485-8604.</p>
    <a class="btn" id="home" href="/">Back to homepage</a>
  </main>
  <script>
    // On a GitHub Pages project URL (user.github.io/repo/) the site lives one folder down.
    var base = "/";
    if (location.hostname.endsWith(".github.io")) {
      var first = location.pathname.split("/")[1];
      if (first) base = "/" + first + "/";
    }
    document.getElementById("home").href = base;
    var logo = document.getElementById("logo");
    logo.onload = function () { logo.hidden = false; };
    logo.src = base + "assets/img/logo.png";
  </script>
</body>
</html>
